<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">

<title>ターボカート アイランド</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{touch-action:none;overflow:hidden}
body{margin:0;-webkit-text-size-adjust:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
button{font:bold 20px system-ui;padding:14px 26px;border:0;border-radius:14px;background:#ffd23f;color:#222}
input{font:bold 22px system-ui;padding:10px;width:130px;border-radius:10px;border:0;text-align:center}
.ctl{position:fixed;z-index:5;touch-action:none;transform:translate(-50%,-50%)}
#wheel{width:210px;height:210px;opacity:.85}
#wi{width:100%;height:100%;border:18px solid #222;border-radius:50%;position:relative;background:rgba(255,255,255,.15)}
#wi:before{content:"";position:absolute;left:0;right:0;top:46%;height:12%;background:#222}
#wi:after{content:"";position:absolute;top:50%;bottom:0;left:46%;width:12%;background:#222}
#wi i{position:absolute;top:-18px;left:calc(50% - 8px);width:16px;height:18px;background:#e33;z-index:2}

.b:active{background:rgba(255,255,255,.7)}
.sel{outline:4px dashed #0f0}
#hud>div{position:fixed;z-index:4;font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none}
#rk{left:18px;top:12px;font-size:54px}#lp{left:20px;top:78px;font-size:24px}
#tm{right:18px;top:14px;font-size:26px}#cn{right:18px;top:52px;font-size:24px}
#sl{left:50%;top:12px;transform:translateX(-50%);display:flex;gap:8px}
#sl span{width:62px;height:62px;border-radius:12px;background:#0007;border:2px solid #fff;font-size:38px;text-align:center;line-height:58px}
#spd{right:18px;bottom:14px;font-size:22px}
#ctr{left:50%;top:38%;transform:translate(-50%,-50%);font-size:84px;text-align:center}
#edit{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;background:#000b;padding:10px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:15px}
#edit button{font-size:15px;padding:8px 14px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:12}
#res{position:fixed;inset:0;z-index:15;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:30px;text-align:center}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,rgba(10,30,80,0) 25%,rgba(6,12,40,.7) 100%),linear-gradient(rgba(0,20,70,.55),rgba(0,0,0,0) 38%,rgba(0,0,0,.5))}
#menu:before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.08) 0 5deg,transparent 5deg 10deg);animation:spin 50s linear infinite;pointer-events:none}
#menu>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{0%{transform:scale(2.4) rotate(-6deg);opacity:0}60%{transform:scale(.92) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes bob{50%{transform:translateY(-1vh)}}
@keyframes shine{0%{left:-40%}55%,100%{left:140%}}
@keyframes lamp{0%,8%{background:#3a0a0a;box-shadow:none}12%,55%{background:#ff3030;box-shadow:0 0 2vh #f33}60%,85%{background:#3cff6a;box-shadow:0 0 2vh #3f6}90%,100%{background:#3a0a0a;box-shadow:none}}
@keyframes drive{0%{transform:translateX(-25vw)}100%{transform:translateX(112vw)}}
@keyframes rd{to{background-position:-12vw 0}}
@keyframes hop{50%{transform:translateY(-.8vh) rotate(-2deg)}}
@keyframes fl{0%{transform:translateY(105vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
#lights{display:flex;gap:1.2vh;background:#111;padding:.8vh 1.6vh;border-radius:2vh;border:.4vh solid #555}
#lights i{width:3vh;height:3vh;border-radius:50%;background:#3a0a0a;animation:lamp 3.6s infinite}
#lights i:nth-child(2){animation-delay:.3s}#lights i:nth-child(3){animation-delay:.6s}
#logo{text-align:center;animation:popin .8s cubic-bezier(.2,1.4,.4,1) both}
#logo .t{display:inline-block;position:relative;isolation:isolate;font:900 italic min(15vh,88px)/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:.02em;margin:0 .08em;background:linear-gradient(#fff6a8,#ffd23f 45%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .8vh 0 #0b1450)}
#logo .t:before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#1b2a78;-webkit-text-stroke:1.7vh #1b2a78;background:none}
#logo .t.r{background:linear-gradient(#ffc0c0,#ff4a4a 50%,#c40d3a);-webkit-background-clip:text;background-clip:text}
#logo .s{font:800 min(2.8vh,18px) system-ui;letter-spacing:.2em;color:#fff;text-shadow:0 .3vh 0 #0b1450,0 0 2vh #4fd0ff}
#cards{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap}
.mc{position:relative;overflow:hidden;width:min(28vw,250px);padding:1.6vh .8vw;border:0;border-radius:2.4vh;color:#fff;display:flex;flex-direction:column;align-items:center;gap:.4vh;font-family:system-ui,sans-serif;box-shadow:0 1vh 0 var(--sh),0 2vh 3vh #0007,inset 0 .6vh 0 #fff6;background:linear-gradient(var(--a),var(--b));animation:popin .6s cubic-bezier(.2,1.4,.4,1) both;transition:transform .1s}
.mc:nth-child(1){animation-delay:.25s}.mc:nth-child(2){animation-delay:.4s}.mc:nth-child(3){animation-delay:.55s}
.mc b{font-size:min(3.6vh,22px);text-shadow:0 .3vh 0 #0006}
.mc small{font-size:min(2.2vh,13px);font-weight:700;opacity:.95}
.mc .ic{font-size:min(8vh,48px);animation:bob 1.4s ease-in-out infinite;filter:drop-shadow(0 .6vh .6vh #0006)}
.mc:after{content:"";position:absolute;top:0;bottom:0;width:28%;left:-40%;background:linear-gradient(90deg,transparent,#fff8,transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
.mc:active{transform:translateY(.8vh) scale(.97)}
.c1{--a:#ff7a45;--b:#e8262f;--sh:#8a1018}.c2{--a:#4fc3ff;--b:#2a5be0;--sh:#14327f}.c3{--a:#5be07a;--b:#16a34a;--sh:#0b5a2a}
#net{display:flex;flex-direction:column;gap:1vh;align-items:center;background:#000a;padding:1.4vh 2vw;border-radius:2vh;border:.3vh solid #fff5}
#net button{font-size:min(3vh,18px);padding:1vh 2vw}
#best{font:800 min(2.6vh,16px) system-ui;color:#ffe14d;text-shadow:0 .3vh 0 #000a;min-height:1em}
#setBtn{background:#fff9!important;font-size:min(2.6vh,15px)!important;padding:.8vh 2vw!important;border-radius:2vh!important}
#road{position:absolute!important;left:0;right:0;bottom:0;height:11vh;background:linear-gradient(#3b3f55,#23263a);border-top:1vh solid #eee;overflow:hidden}
#road:before{content:"";position:absolute;left:0;right:0;top:52%;height:.9vh;background:repeating-linear-gradient(90deg,#ffe14d 0 6vw,transparent 6vw 12vw);animation:rd .45s linear infinite}
#kartsv{position:absolute;bottom:1.2vh;left:0;width:min(18vw,160px);animation:drive 5.5s linear infinite}
#kartsv svg{width:100%;display:block;animation:hop .3s infinite}
.fi{position:absolute!important;font-size:min(5vh,30px);opacity:.55;animation:fl 9s linear infinite;pointer-events:none}
#ink{inset:0;overflow:hidden}
.sq{position:absolute;left:50%;bottom:-30%;font-size:min(36vh,220px);filter:drop-shadow(0 0 2vh #a050ff);animation:sqfly .75s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes sqfly{0%{bottom:-30%;transform:translateX(-50%) scale(.4) rotate(-25deg);opacity:1}70%{bottom:28%;transform:translateX(-50%) scale(1.2) rotate(8deg);opacity:1}100%{bottom:32%;transform:translateX(-50%) scale(1.7) rotate(0);opacity:0}}
.flash{position:absolute;inset:0;background:radial-gradient(#fffc,#fff0 60%);opacity:0;animation:fls .4s .5s forwards}
@keyframes fls{0%{opacity:1}100%{opacity:0}}
.blob{position:absolute;opacity:0;animation:wipe var(--fd) ease-in var(--fl) forwards,show 0s var(--dl) forwards}
@keyframes show{to{opacity:1}}
@keyframes wipe{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(7vh)}}
.bi{width:100%;height:100%;background:radial-gradient(circle at 38% 32%,#4b3a78 0,#1c1236 38%,#06030f 100%);box-shadow:inset -.6vh -.8vh 1.4vh #0008,0 0 1.8vh #000a;transform:scale(0);animation:pop .3s var(--dl) cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes pop{to{transform:scale(1) rotate(var(--r))}}
.dr{position:absolute;top:60%;width:12%;border-radius:0 0 50% 50%;background:#0a0618;transform-origin:top;transform:scaleY(0);animation:drip 3s var(--dl) ease-in forwards}
@keyframes drip{to{transform:scaleY(1)}}
#by{left:50%;top:54%;transform:translate(-50%,-50%);font-size:44px;color:#fff;text-align:center;white-space:nowrap;text-shadow:0 0 14px #f33,0 3px 0 #800}
#sl span.rl{border-color:#6fd3ff;box-shadow:0 0 14px #6fd3ff;background:#1b3a5acc}
#menu>#namebox{position:absolute!important;left:2vh;top:2vh;display:flex;align-items:center;gap:1vh;background:linear-gradient(#ffffffee,#dfe9ffee);border-radius:3vh;padding:.7vh 1.6vh .7vh 1vh;box-shadow:0 .6vh 0 #14327f,0 1.4vh 2vh #0006;border:.4vh solid #2a5be0;z-index:3;animation:popin .6s .1s both}
#namebox span{font-size:min(4vh,24px)}
#namebox input{width:min(30vw,170px);border:0;background:transparent;font:900 min(3vh,18px) system-ui,sans-serif;color:#14327f;outline:none}
.ov{position:fixed;inset:0;z-index:22;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0a1e50aa,#030814ee);backdrop-filter:blur(3px)}
#rules{z-index:24}
.pn{position:relative;background:linear-gradient(#27356e,#141b3f);border:.5vh solid #6fd3ff;border-radius:3vh;padding:2vh 2.4vw;color:#fff;box-shadow:0 0 4vh #4fd0ff77,0 1.2vh 0 #0a1030;display:flex;flex-direction:column;align-items:center;gap:1.4vh;max-height:94vh;overflow:auto;animation:popin .45s cubic-bezier(.2,1.4,.4,1) both;font-family:system-ui,sans-serif}
.pn h2{margin:0;font:900 italic min(4.6vh,28px) system-ui;color:#ffe14d;text-shadow:0 .4vh 0 #8a4a00,0 0 2vh #ffb000}
.big{border:0;border-radius:2.2vh;padding:1.3vh 2.4vw;font:900 min(3vh,19px) system-ui,sans-serif;color:#fff;cursor:pointer;text-shadow:0 .3vh 0 #0005;transition:transform .1s;position:relative;overflow:hidden}
.big:active{transform:translateY(.7vh)}
.big.g{background:linear-gradient(#6af08a,#14a64a);box-shadow:0 .8vh 0 #0b5a2a}
.big.b{background:linear-gradient(#5cc8ff,#2a5be0);box-shadow:0 .8vh 0 #14327f}
.big.o{background:linear-gradient(#ffb04a,#ee6a10);box-shadow:0 .8vh 0 #8a3a05}
.sm{border:0;border-radius:2vh;padding:.8vh 1.6vw;background:#ffffff22;color:#fff;font:700 min(2.6vh,15px) system-ui;cursor:pointer}
.or{font-weight:800;opacity:.7}
.jr{display:flex;gap:1.2vh;align-items:center}
.jr input{width:min(34vw,200px);padding:1.2vh 1.2vw;border-radius:2vh;border:.4vh solid #6fd3ff;background:#0b1236;color:#fff;font:900 min(3.2vh,20px) system-ui;text-align:center;letter-spacing:.2em}
#nerr{min-height:1.2em;color:#ffb0b0;font-weight:700;font-size:min(2.4vh,14px)}
.lb{min-width:min(86vw,560px)}
.lh{display:flex;flex-direction:column;align-items:center;gap:.8vh}
.rc{font:800 min(2.6vh,15px) system-ui;letter-spacing:.2em;opacity:.9}
.rc b{display:inline-block;font:900 min(7vh,44px) system-ui;letter-spacing:.12em;color:#fff;background:linear-gradient(#ffd23f,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .4vh 0 #5a2a00)}
#badges{display:flex;gap:1vh;flex-wrap:wrap;justify-content:center}
.bd{background:#ffffff1f;border:.3vh solid #ffffff44;border-radius:2vh;padding:.4vh 1.2vh;font:800 min(2.3vh,14px) system-ui}
#plist{display:grid;grid-template-columns:repeat(2,1fr);gap:1vh 1.2vw;width:100%}
.pc{display:flex;align-items:center;gap:1vh;background:linear-gradient(#ffffff26,#ffffff0d);border-radius:2vh;padding:.9vh 1.2vh;border-left:1vh solid var(--c,#888);animation:popin .45s both;min-height:5.4vh}
.pc b{font:900 min(3vh,18px) system-ui;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc em{font:800 min(2vh,12px) system-ui;font-style:normal;background:#ffd23f;color:#5a3300;border-radius:1vh;padding:.3vh .9vh}
.pc em.you{background:#6fd3ff;color:#06304a}
.pc.me{box-shadow:0 0 2vh #6fd3ff88;border-color:#6fd3ff}
.av{width:5vh;height:5vh;border-radius:50%;background:var(--c,#888);display:flex;align-items:center;justify-content:center;font:900 min(3vh,18px) system-ui;font-style:normal;box-shadow:inset 0 -.5vh 0 #0004,0 .3vh 0 #0006;flex:none}
.pc.empty{opacity:.45;border-left-color:#888}.pc.empty .av{background:#555}
.dots:after{content:"";animation:dt 1.2s steps(4) infinite}
@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
#lnote{font:700 min(2.4vh,14px) system-ui;opacity:.85;text-align:center}
.lbtn{display:flex;gap:1.4vh;align-items:center;flex-wrap:wrap;justify-content:center}
.rl .sec,.rl>.sec{font:800 min(2.6vh,15px) system-ui;color:#6fd3ff;align-self:flex-start;letter-spacing:.1em}
#ccs{display:flex;gap:1.2vh;flex-wrap:wrap;justify-content:center}
.chip{border:.4vh solid #ffffff44;border-radius:2vh;background:#ffffff14;color:#fff;padding:.9vh 1.4vw;display:flex;flex-direction:column;align-items:center;min-width:min(17vw,110px);cursor:pointer;font-family:system-ui,sans-serif;transition:transform .1s}
.chip span{font-size:min(5vh,30px)}.chip b{font:900 min(3vh,18px) system-ui}.chip small{font:700 min(1.9vh,11px) system-ui;opacity:.8}
.chip.on{background:linear-gradient(#ffd23f,#ff8a1f);color:#4a2600;border-color:#fff;box-shadow:0 0 2.4vh #ffb000;transform:scale(1.06)}
#iw{display:grid;grid-template-columns:repeat(2,1fr);gap:.8vh 2vw;width:100%}
.ir{display:flex;align-items:center;gap:.9vh;background:#ffffff12;border-radius:1.6vh;padding:.6vh 1vh}
.ie{font-size:min(4vh,24px)}.il{font:800 min(2.2vh,13px) system-ui;width:7em}
.ir input{flex:1;min-width:60px;accent-color:#ffb000}
.iv{font:900 min(2.4vh,14px) system-ui;width:3em;text-align:right;color:#ffe14d}
.rb{display:flex;gap:1.4vh}
#res{background:radial-gradient(#0a1e50cc,#030814f0)!important;backdrop-filter:blur(3px)}
.rp{background:linear-gradient(#27356e,#141b3f);border:.5vh solid #ffd23f;border-radius:3vh;padding:2vh 2.4vw;display:flex;flex-direction:column;align-items:center;gap:1.2vh;min-width:min(86vw,520px);max-height:94vh;overflow:auto;box-shadow:0 0 4vh #ffb00077;font-family:system-ui,sans-serif}
.rp h2{margin:0;font:900 italic min(5vh,32px) system-ui;color:#ffe14d;text-shadow:0 .4vh 0 #8a4a00,0 0 2vh #ffb000}
.rl{width:100%;display:flex;flex-direction:column;gap:.7vh}
.rr{display:flex;align-items:center;gap:1.2vh;background:linear-gradient(#ffffff22,#ffffff0d);border-radius:1.8vh;padding:.8vh 1.4vh;font-size:min(3vh,18px);font-weight:800}
.rr.in{animation:rin .5s both}
@keyframes rin{0%{transform:translateX(8vw);opacity:0}100%{transform:none;opacity:1}}
.rr.me{background:linear-gradient(#ffd23f,#ff9a1f);color:#3a1d00;box-shadow:0 0 2vh #ffb000}
.rr .rn{width:1.8em;text-align:center;font-size:min(3.6vh,22px)}
.rr .dot{width:2.4vh;height:2.4vh;border-radius:50%;box-shadow:inset 0 -.3vh 0 #0005;flex:none}
.rr b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .rt{font-variant-numeric:tabular-nums}
.rbtn{display:flex;gap:1.4vh;flex-wrap:wrap;justify-content:center;margin-top:.6vh}
.rnote{font:700 min(2.2vh,13px) system-ui;opacity:.8}
.bigt{font:900 min(11vh,70px) system-ui;color:#fff;text-shadow:0 .6vh 0 #14327f}.bigt small{font-size:.4em}
.nb{font:900 min(4vh,24px) system-ui;color:#ffe14d}.bst{font:800 min(3vh,18px) system-ui;opacity:.85}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><div id="rk"></div><div id="lp"></div><div id="tm"></div><div id="cn"></div><div id="sl"><span></span><span></span></div><div id="spd"></div><div id="ctr"></div><div id="by"></div><div id="ink"></div></div>

</div>

if(c.remote){c.x+=(c.tx-c.x)*Math.min(1,dt*10);c.z+=(c.tz-c.z)*Math.min(1,dt*10);c.y+=((c.ty==null?c.y:c.ty)-c.y)*Math.min(1,dt*10);c.h+=wrap(c.th-c.h)*Math.min(1,dt*10);if(c.fin&&c.finT==0)c.finT=raceT;c.wr+=c.v*dt/.6}
else if(racing){let i;if(c.me&&!c.fin)i=getIn();else{if(c.me){c.sk=.85;c.lane=0}i=ai(c)}
if(c.cpu){c.it-=dt;if(c.it<=0){c.it=7+Math.random()*6;if(!c.items.length)c.items.push(roll(c))}if(c.items.length&&Math.random()<dt*.3&&!c.fin)doItem(c,c.items.shift())}
if(!c.rsp){step(c,dt,i);locate(c);vert(c,dt);if(!isFinite(c.x+c.y+c.z+c.h+c.v)){c.v=0;respawn(c)}else if(c.drift&&c.dt>.25&&c.v>20)spark(c,c.dt>2.2?[1,.3,.9]:c.dt>1.1?[.3,.7,1]:[1,.8,.3],2)}
if(c.prog>=3*N&&!c.fin){c.fin=true;c.finT=raceT;if(c.me){state='done';msg('FINISH!',2000);setTimeout(finish,2200)}}
const lp=clamp(Math.floor(c.prog/N)+1,1,3);if(c.me&&lp>c.lap){c.lap=lp;msg('LAP '+lp+'/3',1200)}}
const mm=c.m;mm.position.set(c.x,c.y,c.z);mm.rotation.y=c.h+c.drift*.35;mm.userData.pc.visible=!!c.para;mm.userData.f.visible=c.boost>0||c.auto>0;mm.userData.b.rotation.z=c.spin>0?0:-(c.sv||0)*.07;wheelUpd(mm,c);if(c.me&&c.para&&!c.pm){c.pm=1;msg('🪂 パラシュート!',1200)}if(!c.para)c.pm=0;mm.visible=!(c.inv>0&&c.spin<=0&&Math.floor(raceT*14)%2&&c.auto<=0)}
if(racing&&me){
if(MODE!='ta'){for(const b of boxes){b.m.rotation.y+=dt*.6;if(!b.on){b.cd-=dt;if(b.cd<=0){b.on=true;b.m.visible=true}}else if(me.items.length<2&&!me.fin&&Math.hypot(b.x-me.x,b.z-me.z)<3.2&&Math.abs(b.m.position.y-me.y-1.8)<5){b.on=false;b.m.visible=false;b.cd=3;me.rt[me.items.length]=1.3;me.items.push(roll(me));spark(me,[.6,.85,1],14);break}}}
for(const k of coinsL){if(!k.on)continue;k.m.rotation.y+=dt*3;if(!me.fin&&Math.hypot(k.x-me.x,k.z-me.z)<3&&Math.abs(k.m.position.y-me.y-1.2)<5){k.on=false;k.m.visible=false;if(me.coins<10)me.coins++}}
for(let i=bans.length-1;i>=0;i--){const b=bans[i];b.t-=dt;for(const c of cars){if(c.remote||b.t>0&&0)continue;if(Math.hypot(b.x-c.x,b.z-c.z)<2.6&&c.spin<=0&&c.inv<=0&&c.auto<=0){applyHit(c,'ban',b.by);send({t:'bx',u:b.u});rmBan(b.u);break}}}
for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.u+=dt*(p.k=='squid'?1.0:1.7);const to=p.t&&!p.miss?new THREE.Vector3(p.t.x,p.t.y+1.2,p.t.z):p.p;p.m.position.lerpVectors(p.f,to,Math.min(1,p.u));if(p.k=='squid'){p.m.position.y+=Math.sin(Math.min(1,p.u)*Math.PI)*9;const sc=7+Math.sin(p.u*30)*.8;p.m.scale.set(sc,sc,1)}if(p.u>=1){S.remove(p.m);projs.splice(i,1);if(p.k=='squid')inkHit(p.t);else if(p.t&&!p.miss)hit(p.t,p.k,p.by)}}
for(let i=efx.length-1;i>=0;i--){const e=efx[i];e.t+=dt;e.m.scale.setScalar(1+e.t*30);e.m.material.opacity=1-e.t/.6;if(e.t>.6){S.remove(e.m);efx.splice(i,1)}}
itemRt(dt);obstUpd(dt);sendT-=dt;if(sendT<=0&&conns.length){sendT=.066;send({t:'st',id:myId,y:me.y,x:me.x,z:me.z,h:me.h,v:me.v,prog:me.prog,coins:me.coins,fin:me.fin,finT:me.finT})}}
// wheel
if(wp==null)wAng*=Math.exp(-dt*8);ws=clamp(wAng/1.2,-1,1);$('wi').style.transform=`rotate(${wAng}rad)`;
lightUpd(dt);sparkUpd(dt);hud();cameraUpd(dt)}
function hud(){if(!me)return;const r=rank(me);$('rk').textContent=MODE=='ta'?'':r+'位';$('lp').textContent='LAP '+clamp(Math.floor(me.prog/N)+1,1,3)+'/3';$('tm').textContent=Math.max(0,raceT).toFixed(2)+'s';$('cn').textContent='🪙×'+me.coins;$('spd').textContent=Math.round(Math.abs(me.v)*2.2)+' km/h';
[0,1].forEach(i=>{const s=$('sl').children[i],k=me.items[i];if(me.rt[i]>0){const ks=Object.keys(EM),kk=ks[(Math.floor(performance.now()/(60+(1.3-me.rt[i])*90))+i*4)%ks.length];s.textContent=EM[kk];s.style.filter=FL[kk]||'';s.classList.add('rl')}else{s.textContent=k?EM[k]:'';s.style.filter=FL[k]||'';s.classList.remove('rl')}})}
function cameraUpd(dt){const m=me,hh=(m.spin>0&&m.hs!=null)?m.hs:m.h,sp=Math.min(1,Math.abs(m.v)/100);let D,H,f=cdT>0&&state=='count'?Math.max(0,cdT)/3.99:0;
if(state=='count'){cy=m.h+f*f*2.6;D=7+f*10;H=3.2+f*5}
else if(m.fin){cy+=dt*.6;D=11;H=5}
else{cy+=wrap(hh-m.drift*.18-cy)*Math.min(1,dt*(3.5+sp*2));D=7.5+sp*3+(m.boost>0||m.auto>0?2.5:0);H=3.1+sp*.8}
const sh=(m.boost>0||m.auto>0)?.18:0,tp=new THREE.Vector3(m.x-Math.sin(cy)*D+(Math.random()-.5)*sh,m.y+H+(Math.random()-.5)*sh,m.z-Math.cos(cy)*D);
if(state=='count')cam.position.copy(tp);else cam.position.lerp(tp,Math.min(1,dt*14));
cam.lookAt(m.x+Math.sin(hh)*6,m.y+1.3,m.z+Math.cos(hh)*6);cam.rotateZ(ws*.05+m.drift*.07*(m.drift?1:0));
const tf=66+sp*16+(m.boost>0||m.auto>0?14:0)+(m.drift?5:0)+(m.air?8:0);cfov+=(tf-cfov)*Math.min(1,dt*5);if(!isFinite(cfov))cfov=70;cfov=clamp(cfov,55,100);cam.fov=cfov;cam.updateProjectionMatrix()}
// idle camera for menu
let clk=new THREE.Clock(),ta=0;
function loop(){const dt=Math.min(.05,clk.getDelta());if(state=='menu'){ta+=dt*.08;cam.position.set(Math.sin(ta)*560,130,Math.cos(ta)*520+30);cam.lookAt(0,10,30)}else update(dt);world(dt);R.render(S,cam);requestAnimationFrame(loop)}
{const b=+localStorage.kartBest;if(b)$('best').textContent='🏆 ベストタイム '+b.toFixed(2)+'秒'}
rs();loop();
</script></body></html>
